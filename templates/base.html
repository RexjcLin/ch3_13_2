<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <style>
        :root {
            --bg: #05070d;
            --bg-2: #0b1220;
            --panel: rgba(16, 20, 29, 0.96);
            --panel-strong: rgba(22, 29, 39, 0.98);
            --surface: rgba(28, 36, 46, 0.94);
            --ink: #edf6ff;
            --muted: #c4d3e5;
            --line: rgba(147, 206, 255, 0.2);
            --line-strong: rgba(147, 206, 255, 0.5);
            --shadow: 0 18px 60px rgba(0, 0, 0, 0.6);
            --cyan: #76f6ff;
            --cyan-soft: rgba(118, 246, 255, 0.25);
            --magenta: #ff5de2;
            --magenta-soft: rgba(255, 93, 226, 0.18);
            --steel-1: #edf3ff;
            --steel-2: #a9b9c7;
            --steel-3: #6f7e8d;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
            background:
                radial-gradient(circle at 15% 15%, rgba(118, 246, 255, 0.12), transparent 22%),
                radial-gradient(circle at 80% 20%, rgba(255, 93, 226, 0.10), transparent 20%),
                linear-gradient(90deg, rgba(255,255,255,0.03) 0, rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(180deg, rgba(255,255,255,0.03) 0, rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(160deg, var(--bg), var(--bg-2));
            background-size: auto, auto, 22px 22px, 22px 22px, auto;
            color: var(--ink);
        }

        body {
            padding: 32px 18px 48px;
        }

        a {
            color: var(--cyan);
            text-decoration: none;
            transition: all 0.2s ease;
        }

        a:hover {
            opacity: 1;
            text-decoration: underline;
            text-shadow: 0 0 14px rgba(118, 246, 255, 0.9);
        }

        .industrial-shell {
            max-width: 1280px;
            margin: 0 auto;
            background: linear-gradient(180deg, rgba(11,18,26,0.96), rgba(18,24,32,0.98));
            border: 1px solid var(--line-strong);
            box-shadow:
                0 0 0 1px rgba(118, 246, 255, 0.08),
                0 0 26px rgba(118, 246, 255, 0.08),
                0 18px 60px rgba(0, 0, 0, 0.65),
                inset 0 1px 0 rgba(255,255,255,0.08);
            padding: 28px 24px 36px;
            position: relative;
            overflow: hidden;
        }

        .industrial-shell::before {
            content: "";
            position: absolute;
            inset: 10px;
            border: 1px solid rgba(118, 246, 255, 0.18);
            box-shadow: inset 0 0 28px rgba(118, 246, 255, 0.06), inset 0 0 18px rgba(255, 93, 226, 0.04);
            pointer-events: none;
        }

        .industrial-shell::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--cyan), var(--magenta), transparent);
            box-shadow: 0 0 18px rgba(118, 246, 255, 0.9), 0 0 22px rgba(255, 93, 226, 0.6);
        }

        .industrial-header {
            margin: 0 0 20px;
            padding-bottom: 14px;
            font-size: clamp(1.8rem, 2.4vw, 2.9rem);
            letter-spacing: 0.26em;
            text-transform: uppercase;
            text-align: center;
            border-bottom: 1px solid var(--line);
            color: var(--steel-1);
            text-shadow: 0 0 18px rgba(118, 246, 255, 0.25), 0 0 22px rgba(255, 93, 226, 0.18);
            background: linear-gradient(180deg, #f6fbff, #c5d7ea 28%, #77d5ff 55%, #f6fbff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .industrial-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            padding: 16px 18px;
            background: linear-gradient(180deg, rgba(118,246,255,0.04), rgba(255,93,226,0.02), rgba(255,255,255,0.01));
            border: 1px solid var(--line);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 0 18px rgba(118, 246, 255, 0.08);
            margin-bottom: 24px;
        }

        .industrial-toolbar .meta {
            color: var(--muted);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-size: 0.75rem;
        }

        .industrial-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 18px;
            border: 1px solid rgba(118, 246, 255, 0.55);
            background: linear-gradient(180deg, #f4fbff 0%, #bcdeff 28%, #6d7ec0 70%, #111827 100%);
            color: #09111d;
            font-weight: 900;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.7), 0 0 18px rgba(118, 246, 255, 0.22);
        }

        .industrial-button.secondary {
            background: linear-gradient(180deg, rgba(118,246,255,0.06), rgba(255,93,226,0.02));
            color: var(--ink);
        }

        .industrial-search {
            display: flex;
            justify-content: center;
            margin-bottom: 22px;
        }

        .industrial-search form {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 14px 18px;
            border: 1px solid var(--line);
            background: linear-gradient(180deg, rgba(118,246,255,0.04), rgba(255,93,226,0.02));
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 0 18px rgba(118, 246, 255, 0.08);
            width: min(100%, 840px);
        }

        .industrial-search label {
            color: var(--muted);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-size: 0.74rem;
        }

        .console-search {
            position: relative;
            display: flex;
            align-items: center;
            gap: 12px;
            width: min(100%, 760px);
            padding: 10px 12px;
            border: 1px solid rgba(118, 246, 255, 0.28);
            background: linear-gradient(180deg, rgba(16,24,32,0.7), rgba(10,14,22,0.85));
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: inset 0 0 18px rgba(118, 246, 255, 0.08), 0 0 18px rgba(118, 246, 255, 0.12);
        }

        .search-icon {
            position: absolute;
            left: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--cyan);
            opacity: 0.9;
            filter: drop-shadow(0 0 8px rgba(118,246,255,0.8));
            pointer-events: none;
        }

        .console-input {
            width: 560px;
            max-width: 100%;
            padding: 12px 16px 12px 42px;
            border: 1px solid rgba(118, 246, 255, 0.26);
            background: rgba(7, 12, 18, 0.75);
            color: var(--ink);
            font: inherit;
            box-shadow: inset 0 0 0 1px rgba(118,246,255,0.08), 0 0 14px rgba(118, 246, 255, 0.06);
        }

        .console-input:focus {
            outline: none;
            border-color: rgba(118, 246, 255, 0.7);
            box-shadow: 0 0 0 1px rgba(118,246,255,0.16), 0 0 18px rgba(118,246,255,0.20);
        }

        .industrial-search input[type="text"],
        .industrial-form input[type="text"],
        .industrial-form input[type="email"],
        .industrial-form input[type="date"],
        .industrial-form input[type="submit"],
        .industrial-form input[type="reset"],
        .industrial-form button {
            border: 1px solid rgba(118, 246, 255, 0.26);
            background: rgba(10, 15, 22, 0.9);
            color: var(--ink);
            padding: 10px 12px;
            font: inherit;
            box-shadow: inset 0 0 0 1px rgba(118,246,255,0.08), 0 0 14px rgba(118, 246, 255, 0.06);
        }

        .industrial-search input[type="submit"],
        .industrial-form input[type="submit"],
        .industrial-form input[type="reset"] {
            background: linear-gradient(180deg, #e8fbff 0%, #9be8ff 24%, #82c7ff 50%, #2d4b7d 100%);
            color: #08131f;
            cursor: pointer;
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .industrial-table {
            width: 100%;
            border-collapse: collapse;
            background: linear-gradient(180deg, rgba(12,18,24,0.82), rgba(8,12,18,0.92));
            border: 1px solid rgba(118,246,255,0.22);
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(118,246,255,0.05), 0 0 20px rgba(118,246,255,0.04), 0 0 0 1px rgba(255,255,255,0.02);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .industrial-table th,
        .industrial-table td {
            border: 1px solid rgba(118,246,255,0.18);
            padding: 14px 12px;
            text-align: center;
            vertical-align: middle;
            color: var(--ink);
            background: rgba(12, 18, 24, 0.36);
        }

        .industrial-table th {
            background: linear-gradient(180deg, rgba(118,246,255,0.12), rgba(255,93,226,0.03), rgba(255,255,255,0.02));
            color: var(--steel-1);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-size: 0.72rem;
            text-shadow: 0 0 12px rgba(118,246,255,0.22);
        }

        .industrial-table td {
            color: var(--muted);
            background: rgba(9, 14, 20, 0.44);
        }

        .industrial-table tbody tr:hover {
            background: rgba(118, 246, 255, 0.04);
            box-shadow: inset 0 0 18px rgba(118,246,255,0.04);
        }

        .industrial-pagination {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 26px;
            color: var(--muted);
        }

        .industrial-pagination a,
        .industrial-pagination strong {
            padding: 7px 10px;
            border: 1px solid var(--line);
            background: rgba(255,255,255,0.02);
            min-width: 38px;
            text-align: center;
            box-shadow: inset 0 1px rgba(255,255,255,0.05);
        }

        .industrial-pagination strong {
            background: linear-gradient(180deg, rgba(118,246,255,0.14), rgba(255,93,226,0.06));
            color: var(--ink);
            box-shadow: 0 0 14px rgba(118,246,255,0.2), 0 0 18px rgba(255, 93, 226, 0.15);
        }

        .industrial-form-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 16px;
        }

        .industrial-form {
            width: min(100%, 760px);
            border: 1px solid var(--line);
            background: linear-gradient(180deg, rgba(118,246,255,0.03), rgba(255,93,226,0.02), rgba(255,255,255,0.01));
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.04), 0 0 28px rgba(118,246,255,0.05);
            padding: 20px;
        }

        .industrial-form table {
            width: 100%;
            border-collapse: collapse;
        }

        .industrial-form th,
        .industrial-form td {
            border: 1px solid var(--line);
            padding: 12px 14px;
            text-align: left;
            vertical-align: middle;
        }

        .industrial-form th {
            width: 160px;
            color: var(--steel-1);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-size: 0.75rem;
            background: rgba(255,255,255,0.02);
        }

        .industrial-form td {
            background: rgba(8, 13, 20, 0.5);
        }

        .industrial-form input[type="radio"] {
            accent-color: var(--cyan);
            margin-right: 8px;
        }

        .industrial-form input[type="date"] {
            color-scheme: dark;
            accent-color: var(--cyan);
        }

        .industrial-form input[type="date"]::-webkit-calendar-picker-indicator {
            filter: brightness(0) saturate(100%) invert(64%) sepia(96%) saturate(451%) hue-rotate(155deg) brightness(1.5) contrast(1.5) drop-shadow(0 0 8px rgba(118, 246, 255, 0.9));
            cursor: pointer;
            opacity: 1;
        }

        .industrial-form .actions {
            text-align: center;
        }

        .muted {
            color: var(--muted);
        }

        @media (max-width: 720px) {
            body {
                padding: 16px 10px 32px;
            }

            .industrial-shell {
                padding: 18px 12px 24px;
            }

            .industrial-toolbar {
                justify-content: center;
            }

            .industrial-form th {
                width: 120px;
            }
        }
    </style>
    {% block style %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}
    <div id="loading-message" style="display: none;">
        <p>載入中，請稍候...</p>
    </div>
</body>
</html>
