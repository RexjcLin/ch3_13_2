{% extends "base.html" %}
{% block title %}新增學生資料{% endblock %}
{% block content %}
<div class="industrial-shell">
    <h1 class="industrial-header">新增學生資料</h1>

    <div class="industrial-toolbar">
        <span class="meta">資料輸入</span>
        <a class="industrial-button secondary" href="{% url 'index' %}">回首頁</a>
    </div>

    <div class="industrial-form-wrap">
        <form class="industrial-form" action="{% url 'post' %}" method="POST">
            {% csrf_token %}
            <table>
                <tr>
                    <th>*姓名</th>
                    <td><input type="text" id="cname" name="cname" required placeholder="請輸入姓名"></td>
                </tr>
                <tr>
                    <th>*性別</th>
                    <td>
                        <input type="radio" id="csex_m" name="csex" value="M" checked>男
                        <input type="radio" id="csex_f" name="csex" value="F">女
                    </td>
                </tr>
                <tr>
                    <th>*生日</th>
                    <td><input type="date" id="cbirthday" name="cbirthday" required></td>
                </tr>
                <tr>
                    <th>*信箱</th>
                    <td><input type="email" id="cemail" name="cemail" required placeholder="請輸入mail"></td>
                </tr>
                <tr>
                    <th>電話</th>
                    <td><input type="text" id="cphone" name="cphone"></td>
                </tr>
                <tr>
                    <th>地址</th>
                    <td><input type="text" id="caddr" name="caddr"></td>
                </tr>
                <tr>
                    <th colspan="2" class="actions">
                        <input type="submit" name="button" id="button" value="儲存">
                        <input type="reset" name="button2" id="button2" value="清除">
                    </th>
                </tr>
            </table>
        </form>
    </div>
</div>
{% endblock %}
